name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests and vet
        run: make test
      - name: Verify recorded artifacts
        run: python3 scripts/verify_artifacts.py examples/lab-run
      - name: Replay the demonstration
        run: make demo
      - name: Rebuild browser reports
        run: make web-demo
      - name: Verify published reports match the CLI
        run: git diff --exit-code -- docs/demo
